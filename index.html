<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#079fca"><title>Know the People Behind the Services</title>
<style>
:root{--blue:#079fca;--deep:#00729f;--navy:#155975;--yellow:#ffed22;--green:#83c83b;--card:#ffcc83;--ink:#07384b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Clother", "Chalkboard SE","Comic Sans MS",system-ui,sans-serif;color:var(--ink)}body{min-height:100svh;overflow-x:hidden;background:radial-gradient(circle at 12% 8%,#ffffff35 0 10px,transparent 11px),radial-gradient(circle at 68% 22%,#ffffff2a 0 15px,transparent 16px),linear-gradient(125deg,#94d9e8 0%,#09a9d0 52%,#00729f 100%);background-size:67px 67px,91px 91px,cover;background-attachment:fixed}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}button:focus-visible{outline:4px solid white;outline-offset:3px}.screen{display:none;min-height:100svh;width:100%;padding:0;align-items:center;justify-content:center}.screen.active{display:flex}.screen-shell{width:min(100%,520px);margin:auto;padding:18px 16px 24px;text-align:center}
/* The opening art is the user's exact reference template. Only the design-spec callouts are masked. */
#intro-screen{position:relative;display:none;overflow:hidden;background:#08a6cf}#intro-screen.active{display:flex}#introTemplate{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none} .spec-mask{position:absolute;pointer-events:none;background-color:#09a7ce;background-image:radial-gradient(circle at 13% 16%,#ffffff40 0 7px,transparent 8px),radial-gradient(circle at 63% 56%,#ffffff2b 0 10px,transparent 11px),linear-gradient(100deg,#8fd7e7 0%,#08a6cf 56%,#087ba5 100%);background-size:83px 83px,111px 111px,100% 100%}.mask-left{left:0;top:50.8%;width:55%;height:19%}.mask-bottom{left:24%;top:78.5%;width:52%;height:7.2%}.intro-next-hit{position:absolute;left:33%;top:71.8%;width:35%;height:5.1%;border-radius:999px;background:transparent;color:transparent}
/* Instruction screen: layout mirrors the reference and demonstrates a complete drag. */
#instruction-screen{position:relative;overflow:hidden;background:#00314f}#instructionTemplate{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.instruction-mask{position:absolute;z-index:2;pointer-events:none;background-image:radial-gradient(circle at 20% 20%,#0c6070 0 7px,transparent 8px),linear-gradient(120deg,#174d5a 0%,#00314f 100%);background-size:67px 67px,100% 100%}.im-arrow-left{left:7%;top:3%;width:26%;height:14%}.im-label-left{left:4%;top:16.5%;width:37%;height:6.5%}.im-arrow-right{left:77%;top:6%;width:17%;height:19%}.im-label-right{left:51%;top:23.5%;width:43%;height:6.2%}.im-label-bottom{left:40%;top:81.7%;width:44%;height:5.5%}.im-arrow-bottom{left:43%;top:86.5%;width:18%;height:5.5%}.instruction-tray{position:absolute;z-index:3;left:4.5%;top:76.5%;width:91%;height:16.5%;border-radius:30px;background:#fff;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:center;gap:2.5%;padding:1.8% 8%;box-shadow:0 4px 14px #002b3b30}.instruction-tray img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 4px #3d270c30)}.demo-hand{position:absolute;z-index:4;left:17%;top:78%;width:24%;height:auto;pointer-events:none;animation:dragDemo 3.5s ease-in-out infinite;filter:drop-shadow(0 4px 3px #002d3b35)}.start-button{position:absolute;z-index:5;left:32%;top:91.4%;width:36%;height:6%;border-radius:999px;background:var(--green);color:#075a7d;font-size:clamp(23px,5vw,30px);font-weight:900;box-shadow:0 5px 0 #367a2a55}.start-button:active{transform:translateY(3px);box-shadow:0 2px 0 #367a2a55}
/* Gameplay */
#game-screen{align-items:stretch;padding:12px 12px max(14px,env(safe-area-inset-bottom))}.game-shell{width:min(100%,900px);margin:0 auto;display:flex;flex-direction:column;min-height:calc(100svh - 26px);gap:9px}.game-top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:white;font-weight:900}.score{font-size:clamp(22px,5.2vw,31px);line-height:1.05;text-align:left;text-shadow:0 2px 3px #00516c66}.score small{font-size:12px;letter-spacing:.06em;display:block;margin-bottom:3px}.attempts{font-size:clamp(12px,3vw,16px);text-align:right;text-shadow:0 2px 3px #00516c66}.attempt-dots{display:flex;gap:7px;justify-content:flex-end;margin-top:6px}.attempt-dot{width:15px;height:15px;border:2px solid white;border-radius:50%;background:transparent}.attempt-dot.used{background:#ff3b40;border-color:#ffb4b4}.game-instruction{color:#053f56;font-size:clamp(14px,3.5vw,19px);font-weight:900;margin:0;text-align:center}.people-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(7px,2vw,15px);width:min(100%,650px);margin:0 auto;flex:1;align-content:center;min-height:0}.person-zone{position:relative;border:3px solid transparent;border-radius:19px;background:#ffffff22;padding:0;min-width:0;display:flex;align-items:stretch;justify-content:center;transition:border-color .15s,background .15s,transform .15s;min-height:0;touch-action:manipulation;overflow:hidden}.person-zone img.person-art{width:100%;height:100%;max-height:clamp(190px,27vh,280px);object-fit:contain;display:block;pointer-events:none}.person-zone.selected-target{border-color:#ffed21;background:#ffffff80;transform:scale(1.015)}.person-zone.correct-target{border-color:#42a84b;background:#dff9db}.person-zone.wrong-target{border-color:#ff3939;background:#ffe0dc}.feedback-icon{position:absolute;top:2px;left:2px;width:clamp(34px,8vw,55px);height:clamp(34px,8vw,55px);object-fit:contain;background:white;border-radius:50%;box-shadow:0 2px 8px #00384c30;z-index:3;pointer-events:none}.tray{background:#ffffffef;border-radius:25px;padding:10px 8px 12px;box-shadow:0 7px 20px #00445d28;margin-top:2px}.task-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(5px,2vw,13px);align-items:stretch;min-height:clamp(120px,20vh,175px)}.task-card{background:var(--card);border-radius:15px;border:2px solid #ffbd66;box-shadow:0 4px 9px #5b390b30;min-width:0;display:flex;align-items:center;justify-content:center;position:relative;padding:3px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .15s,border-color .15s}.task-card img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;border-radius:10px}.task-card.selected{outline:4px solid #0788b4;outline-offset:1px;transform:translateY(-3px)}.task-card.empty{visibility:hidden}.tray-arrows{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:#155975;font-size:12px;font-weight:800}.arrow-btn{background:transparent;color:#155975;font-size:27px;padding:0 10px;line-height:1}.status-message{min-height:20px;color:white;font-weight:900;text-align:center;font-size:clamp(13px,3.2vw,17px);text-shadow:0 2px 3px #00516c;margin-top:-2px}.drag-ghost{position:fixed;z-index:1000;pointer-events:none;width:clamp(90px,23vw,150px);height:clamp(110px,26vh,190px);object-fit:contain;transform:translate(-50%,-55%);filter:drop-shadow(0 10px 8px #002b3b55)}
/* Result page */
#end-screen{position:relative;overflow:hidden;background:#09a7cf}#endTemplate{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}.end-mask{position:absolute;z-index:2;pointer-events:none;background-image:radial-gradient(circle at 20% 20%,#37b9d4 0 8px,transparent 9px),linear-gradient(100deg,#8ed6e7 0%,#08a6cf 56%,#087ba5 100%);background-size:83px 83px,100% 100%}.end-note-right1{left:73%;top:72.8%;width:27%;height:6.1%}.end-note-right2{left:77%;top:80%;width:23%;height:5.8%}.end-note-left{left:3%;top:93.5%;width:42%;height:6.5%}.end-arrow-left{left:5%;top:86.5%;width:15%;height:7%}.end-score-mask{left:19%;top:80.2%;width:55%;height:5.2%;background-image:linear-gradient(100deg,#17a9cf 0%,#22b7d7 56%,#67cfe0 100%)}.end-score-live{position:absolute;z-index:4;left:17%;top:80.2%;width:58%;height:5%;display:flex;align-items:center;justify-content:center;color:#155975;font-weight:900;font-size:clamp(24px,5.6vw,39px);text-shadow:0 1px 1px #fff}.replay-hit{position:absolute;z-index:5;left:61%;top:85.8%;width:13%;height:6.4%;border-radius:50%;background:transparent}
@keyframes dragDemo{0%,10%{transform:translate(0,0) rotate(-10deg) scale(1)}22%{transform:translate(0,-4vh) rotate(-4deg) scale(1.06)}44%,60%{transform:translate(0,-50vh) rotate(4deg) scale(1.03)}78%{transform:translate(0,-4vh) rotate(-3deg) scale(1.02)}90%,100%{transform:translate(0,0) rotate(-10deg) scale(1)}}
@media(min-width:700px){.game-shell{min-height:calc(100svh - 28px)}.people-grid{grid-template-columns:repeat(4,minmax(0,1fr));width:100%;gap:12px}.person-zone img.person-art{max-height:clamp(230px,42vh,390px)}.task-row{min-height:150px}.task-card{max-width:230px;width:100%;justify-self:center}}
@media(max-height:720px){.game-shell{gap:6px}.person-zone img.person-art{max-height:clamp(130px,23vh,200px)}.task-row{min-height:100px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style></head>
<body>
<section class="screen active" id="intro-screen" aria-label="Opening page">
  <img id="introTemplate" src="assets/Intro Template-Ref.png" alt="Know the People Behind the Services">
  <div class="spec-mask mask-left"></div><div class="spec-mask mask-bottom"></div>
  <button class="intro-next-hit" id="nextBtn" aria-label="Next">Next</button>
</section>
<section class="screen" id="instruction-screen" aria-label="How to play">
 <img id="instructionTemplate" src="assets/Instruction Template-Ref.png" alt="How to play: drag a role card to the matching professional">
 <div class="instruction-mask im-arrow-left"></div><div class="instruction-mask im-label-left"></div><div class="instruction-mask im-arrow-right"></div><div class="instruction-mask im-label-right"></div><div class="instruction-mask im-label-bottom"></div><div class="instruction-mask im-arrow-bottom"></div>
 <div class="instruction-tray" aria-hidden="true"><img src="assets/OPD Clinical Services.png" alt=""><img src="assets/Provide Treatment.png" alt=""><img src="assets/Lead UPHC Team.png" alt=""></div>
 <img class="demo-hand" src="assets/Hand.png" alt="Animated hand picking up a task card and dropping it on the Medical Officer">
 <button class="start-button" id="startBtn">Start</button>
</section>
<section class="screen" id="game-screen" aria-label="Gameplay">
 <div class="game-shell">
  <div class="game-top"><div class="score"><small>Score</small><span id="scoreValue">00</span> | 12</div><div class="attempts">Attempt Left<div class="attempt-dots" id="attemptDots"><span class="attempt-dot"></span><span class="attempt-dot"></span><span class="attempt-dot"></span></div></div></div>
  <div class="people-grid" id="peopleGrid"></div>
  <p class="game-instruction">Drag each role card and drop it onto the correct professional!</p>
  <div class="status-message" id="statusMessage" aria-live="polite">Choose a task card to begin.</div>
  <div class="tray"><div class="task-row" id="taskRow"></div><div class="tray-arrows"><button class="arrow-btn" id="prevCards" aria-label="Previous cards">‹</button><span>Show 3 cards at a time</span><button class="arrow-btn" id="nextCards" aria-label="Next cards">›</button></div></div>
 </div>
</section>
<section class="screen" id="end-screen" aria-label="Game results">
 <img id="endTemplate" src="assets/End Page Template-Ref.png" alt="Game complete">
 <div class="end-mask end-note-right1"></div><div class="end-mask end-note-right2"></div><div class="end-mask end-note-left"></div><div class="end-mask end-arrow-left"></div><div class="end-mask end-score-mask"></div>
 <div class="end-score-live" id="endScore">You scored 00/12</div><button class="replay-hit" id="replayBtn" aria-label="Replay"></button>
</section>
<script>
(()=>{
'use strict';
const ASSET='assets/';
const pros=[{id:'mo',name:'Medical Officer',file:'Medical Officer.png'},{id:'sn',name:'Staff Nurse',file:'Staff Nurse.png'},{id:'anm',name:'ANM',file:'ANM.png'},{id:'asha',name:'ASHA',file:'ASHA.png'}];
const taskDefs=[
{id:'opd',name:'OPD Clinical Services',file:'OPD Clinical Services.png',owner:'mo'},
{id:'treatment',name:'Provide Treatment',file:'Provide Treatment.png',owner:'mo'},
{id:'lead',name:'Lead UPHC Team',file:'Lead UPHC Team.png',owner:'mo'},
{id:'assess',name:'Assess the Patient’s Condition',file:'Assess the Patient’s Condition.png',owner:'sn'},
{id:'immunize',name:'Provide Immunization and Counselling Services',file:'Provide Immunization and  Counselling  ervices.png',owner:'sn'},
{id:'followup',name:'Followup Services',file:'Followup Services.png',owner:'sn'},
{id:'outreach',name:'Services in Outreach Camps like RI and UHSND Sessions',file:'Services in Outreach Camps like RI and UHSND Sessions.png',owner:'anm'},
{id:'promotion',name:'Health Promotion Activities',file:'Health Promotion Activities.png',owner:'anm'},
{id:'records',name:'Record Maintenance',file:'Record Maintenance.png',owner:'anm'},
{id:'mobilize',name:'Mobilize the Community',file:'Mobilize the Community.png',owner:'asha'},
{id:'home',name:'Home Visits',file:'Home Visits.png',owner:'asha'},
{id:'awareness',name:'Awareness in the Community',file:'Awareness in the Community.png',owner:'asha'}];
const $=id=>document.getElementById(id);let tasks=[],score=0,selectedId=null,cardOffset=0,drag=null,ghost=null,feedbackTimer=null,audioCtx=null,musicGain=null,musicTimer=null,musicStep=0,suppressClick=false;
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));window.scrollTo(0,0)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
// Background music begins after the user's first interaction (browser audio policy).
function initAudio(){if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return}try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();musicGain=audioCtx.createGain();musicGain.gain.value=.045;musicGain.connect(audioCtx.destination);startMusicLoop()}catch(e){audioCtx=null}}
function tone(freq,duration,type='sine',gain=.06,when=0,into=null){if(!audioCtx)return;const osc=audioCtx.createOscillator(),g=audioCtx.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,audioCtx.currentTime+when);g.gain.setValueAtTime(.0001,audioCtx.currentTime+when);g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+when+.025);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+when+duration);osc.connect(g);g.connect(into||audioCtx.destination);osc.start(audioCtx.currentTime+when);osc.stop(audioCtx.currentTime+when+duration+.04)}
function startMusicLoop(){if(musicTimer)clearInterval(musicTimer);const notes=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,880,783.99,659.25,587.33,523.25];musicTimer=setInterval(()=>{if(!audioCtx)return;const n=notes[musicStep%notes.length];tone(n,.24,'sine',.07,0,musicGain);if(musicStep%4===0)tone([261.63,329.63,392,329.63][Math.floor(musicStep/4)%4],.45,'triangle',.035,0,musicGain);musicStep++},360)}
function sfx(kind){if(!audioCtx)return;if(kind==='correct'){tone(660,.13,'sine',.11);tone(880,.22,'sine',.1,.12)}else if(kind==='wrong'){tone(190,.18,'triangle',.08);tone(145,.23,'triangle',.07,.12)}else if(kind==='finish'){[523,659,784,1046].forEach((n,i)=>tone(n,.28,'sine',.09,i*.13))}else if(kind==='tap'){tone(460,.06,'sine',.035)}}
function newGame(){clearTimeout(feedbackTimer);tasks=shuffle(taskDefs.map(t=>({...t,attempts:3,state:'active'})));score=0;selectedId=null;cardOffset=0;$('scoreValue').textContent='00';$('statusMessage').textContent='Choose a task card to begin.';renderPeople();renderTasks();updateAttempts();showScreen('game-screen');initAudio()}
function renderPeople(){$('peopleGrid').innerHTML=pros.map(p=>`<button type="button" class="person-zone" data-pro="${p.id}" aria-label="${p.name}"><img class="person-art" src="${ASSET+p.file}" alt="${p.name}"></button>`).join('');document.querySelectorAll('.person-zone').forEach(zone=>zone.addEventListener('click',()=>{if(!drag)onTarget(zone.dataset.pro)}))}
function activeTasks(){return tasks.filter(t=>t.state==='active')}
function visibleTasks(){const a=activeTasks();if(!a.length)return[];if(cardOffset>=a.length)cardOffset=Math.max(0,Math.floor((a.length-1)/3)*3);return a.slice(cardOffset,cardOffset+3)}
function renderTasks(){const visible=visibleTasks();$('taskRow').innerHTML='';for(let i=0;i<3;i++){const t=visible[i];if(!t){const blank=document.createElement('div');blank.className='task-card empty';blank.setAttribute('aria-hidden','true');$('taskRow').appendChild(blank);continue}const b=document.createElement('button');b.type='button';b.className='task-card'+(selectedId===t.id?' selected':'');b.dataset.task=t.id;b.setAttribute('aria-label',t.name);b.innerHTML=`<img src="${ASSET+t.file}" alt="${t.name}" draggable="false">`;b.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return}if(!drag)selectTask(t.id)});b.addEventListener('pointerdown',e=>startDrag(e,t.id,b));$('taskRow').appendChild(b)}$('prevCards').disabled=cardOffset===0;$('nextCards').disabled=cardOffset+3>=activeTasks().length;$('prevCards').style.opacity=$('prevCards').disabled?'.35':'1';$('nextCards').style.opacity=$('nextCards').disabled?'.35':'1'}
function selectTask(id){initAudio();sfx('tap');selectedId=selectedId===id?null:id;renderTasks();const t=tasks.find(x=>x.id===selectedId);$('statusMessage').textContent=t?'Now tap the matching professional.':'Choose a task card to begin.';updateAttempts()}
function updateAttempts(){const t=tasks.find(x=>x.id===selectedId&&x.state==='active')||activeTasks()[0];$('attemptDots').querySelectorAll('.attempt-dot').forEach((d,i)=>d.classList.toggle('used',t?i>=t.attempts:true))}
function onTarget(proId){if(!selectedId){$('statusMessage').textContent='Choose a task card first, then tap a professional.';return}resolveTask(selectedId,proId)}
function startDrag(e,id,el){if(e.button!==undefined&&e.button!==0)return;const t=tasks.find(x=>x.id===id&&x.state==='active');if(!t)return;initAudio();drag={id,startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,moved:false,el,pointerId:e.pointerId};document.addEventListener('pointermove',moveDrag,{passive:false});document.addEventListener('pointerup',endDrag,{once:true});document.addEventListener('pointercancel',cancelDrag,{once:true})}
function moveDrag(e){if(!drag)return;const dx=e.clientX-drag.startX,dy=e.clientY-drag.startY;if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;drag.x=e.clientX;drag.y=e.clientY;if(drag.moved){e.preventDefault();if(!ghost){ghost=document.createElement('img');ghost.className='drag-ghost';ghost.src=ASSET+tasks.find(t=>t.id===drag.id).file;ghost.alt='';document.body.appendChild(ghost);drag.el.style.opacity='.3'}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.querySelectorAll('.person-zone').forEach(z=>{const r=z.getBoundingClientRect();z.classList.toggle('selected-target',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)})}}
function cleanupDrag(){document.removeEventListener('pointermove',moveDrag);document.removeEventListener('pointerup',endDrag);document.removeEventListener('pointercancel',cancelDrag);document.querySelectorAll('.person-zone').forEach(z=>z.classList.remove('selected-target'));if(drag&&drag.el)drag.el.style.opacity='';if(ghost){ghost.remove();ghost=null}}
function endDrag(e){if(!drag)return;const d=drag;const didMove=d.moved;const x=e.clientX,y=e.clientY;cleanupDrag();drag=null;if(didMove){suppressClick=true;setTimeout(()=>suppressClick=false,350);const target=document.elementFromPoint(x,y)?.closest('.person-zone');if(target){selectedId=d.id;resolveTask(d.id,target.dataset.pro)}else{selectedId=d.id;renderTasks();updateAttempts()}}}
function cancelDrag(){if(!drag)return;cleanupDrag();drag=null;renderTasks()}
function showFeedback(proId,kind){const zone=document.querySelector(`.person-zone[data-pro="${proId}"]`);if(!zone)return;zone.classList.remove('correct-target','wrong-target');zone.querySelector('.feedback-icon')?.remove();zone.classList.add(kind==='correct'?'correct-target':'wrong-target');const img=document.createElement('img');img.className='feedback-icon';img.src=ASSET+(kind==='correct'?'Correct.png':'Wrong.png');img.alt=kind==='correct'?'Correct':'Wrong';zone.appendChild(img);setTimeout(()=>{zone.classList.remove('correct-target','wrong-target');img.remove()},850)}
function resolveTask(taskId,proId){const t=tasks.find(x=>x.id===taskId&&x.state==='active');if(!t)return;initAudio();if(t.owner===proId){t.state='correct';score++;$('scoreValue').textContent=String(score).padStart(2,'0');showFeedback(proId,'correct');sfx('correct');$('statusMessage').textContent='Correct! Great match!';selectedId=null;renderTasks();updateAttempts();if(!activeTasks().length)feedbackTimer=setTimeout(finishGame,650);else{cardOffset=Math.min(cardOffset,Math.max(0,Math.floor((activeTasks().length-1)/3)*3));setTimeout(()=>{if($('game-screen').classList.contains('active')){$('statusMessage').textContent='Choose your next task card.';renderTasks()}},700)}}else{t.attempts--;showFeedback(proId,'wrong');sfx('wrong');if(t.attempts<=0){t.state='missed';$('statusMessage').textContent='No attempts left. This card is skipped.';selectedId=null;renderTasks();updateAttempts();if(!activeTasks().length)feedbackTimer=setTimeout(finishGame,650);else{cardOffset=Math.min(cardOffset,Math.max(0,Math.floor((activeTasks().length-1)/3)*3));setTimeout(()=>{if($('game-screen').classList.contains('active')){$('statusMessage').textContent='Try the next task card.';renderTasks()}},700)}}else{$('statusMessage').textContent=`Not quite — try again. ${t.attempts} attempt${t.attempts===1?'':'s'} left.`;selectedId=taskId;updateAttempts();renderTasks()}}}
function finishGame(){showScreen('end-screen');$('endScore').textContent=`You scored ${String(score).padStart(2,'0')}/12`;sfx('finish')}
$('nextBtn').addEventListener('click',()=>{initAudio();sfx('tap');showScreen('instruction-screen')});$('startBtn').addEventListener('click',()=>{initAudio();sfx('tap');newGame()});$('replayBtn').addEventListener('click',()=>{initAudio();sfx('tap');newGame()});$('prevCards').addEventListener('click',()=>{cardOffset=Math.max(0,cardOffset-3);selectedId=null;renderTasks();updateAttempts()});$('nextCards').addEventListener('click',()=>{cardOffset=Math.min(Math.max(0,activeTasks().length-1),cardOffset+3);selectedId=null;renderTasks();updateAttempts()});
// Start the background score on the first user interaction; no music label/control is shown.
document.addEventListener('pointerdown',initAudio,{once:true});
})();
</script></body></html>
